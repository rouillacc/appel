<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="html-title">AS Gestion - Appel & Présences</title>

<!-- PWA Tags -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d4ed8">

<!-- Librairies externes (chargées de façon asynchrone pour ne jamais bloquer la page) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #f4f7fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #718096;
  --primary: #2563eb;
  --green: #16a34a;
  --red: #ef4444;
  --border: #e5e7eb;
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 40px; }
button { cursor: pointer; border: none; font-family: inherit; }
input, select { font-family: inherit; width: 100%; border-radius: 10px; border: 1px solid var(--border); padding: 9px 11px; font-size: 15px; outline: none; background: #fff; }
.hidden { display: none !important; }

/* HEADER */
.app-header { background: linear-gradient(135deg, #1d4ed8, #7c3aed); color: #fff; padding: 14px 14px 16px; box-shadow: 0 4px 15px rgba(0,0,0,.15); }
.header-inner { max-width: 1000px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.header-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.header-title h1 { font-size: 17px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-title p { font-size: 11px; opacity: .9; font-weight: bold; }
.header-actions { display: flex; align-items: center; gap: 6px; }
.cloud-badge { font-size: 11px; font-weight: bold; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.2); color: #fff; }
.cloud-badge.online { background: rgba(34,197,94,.35); }
.btn-header { background: rgba(255,255,255,.25); color: #fff; border: 1px solid rgba(255,255,255,.4); padding: 6px 10px; border-radius: 10px; font-size: 11.5px; font-weight: bold; }

/* NAVIGATION */
.main-nav-wrapper { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid var(--border); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.main-nav { max-width: 1000px; margin: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px; }
.nav-btn { min-height: 54px; border-radius: 10px; background: #f8fafc; color: #475569; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; font-size: 11px; font-weight: bold; }
.nav-btn span { font-size: 18px; }
.nav-btn.active { background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; }

/* PAGES & CARDS */
main { max-width: 1000px; margin: auto; padding: 15px 12px; }
.page { display: none; }
.page.active { display: block; }
.card { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 15px rgba(0,0,0,.03); }
.card h3 { margin-bottom: 12px; font-size: 16px; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card { background: #fff; border-radius: 14px; padding: 12px 8px; text-align: center; border: 1px solid var(--border); }
.stat-card span { display: block; font-size: 22px; font-weight: 900; }
.stat-card small { font-size: 11px; color: var(--muted); }

/* APPEL */
.toolbar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: bold; color: var(--muted); margin-bottom: 4px; }
.save-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn-save { min-height: 52px; border-radius: 12px; background: #16a34a; color: #fff; font-size: 15px; font-weight: 900; }
.btn-pdf { min-height: 52px; border-radius: 12px; background: #dc2626; color: #fff; font-size: 15px; font-weight: 900; }
.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.btn-sub { min-height: 42px; border-radius: 10px; background: #e2e8f0; color: #334155; font-weight: bold; font-size: 13px; }
.btn-sub.danger { background: #fee2e2; color: #b91c1c; }

.status-bar { display: flex; justify-content: space-between; align-items: center; background: #eff6ff; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; font-weight: bold; }
.day-hint { font-size: 12px; color: var(--primary); font-weight: bold; margin-top: 4px; display: block; }
.student-list { display: flex; flex-direction: column; gap: 8px; }
.student-row { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; }
.st-info strong { display: block; font-size: 15px; }
.st-info small { color: var(--muted); font-size: 12px; }
.btn-p { width: 54px; height: 46px; border-radius: 10px; background: #e2e8f0; font-size: 19px; font-weight: bold; color: #64748b; }
.btn-p.present { background: #16a34a; color: #fff; }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(15,23,42,.65); display: none; align-items: center; justify-content: center; padding: 12px; }
.modal-overlay.show { display: flex; }
.modal { width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; background: #fff; border-radius: 20px; padding: 18px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.btn-close { width: 34px; height: 34px; border-radius: 50%; background: #fee2e2; color: #dc2626; font-size: 18px; font-weight: bold; }

/* TOAST */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: bold; font-size: 13px; transition: .2s; z-index: 2000; }
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .save-row { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="app-header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="logo">🏆</div>
      <div class="header-title">
        <h1 id="app-school-name">AS CLAUDIE HAIGNERÉ</h1>
        <p id="app-school-sub">ROUILLAC • BOUGE • PARTICIPE</p>
      </div>
    </div>
    <div class="header-actions">
      <span id="cloud-badge" class="cloud-badge">☁️ Prêt</span>
      <button class="btn-header" type="button" onclick="openSchoolsModal()">🏫 Établissement</button>
    </div>
  </div>
</header>

<!-- NAVIGATION -->
<div class="main-nav-wrapper">
  <nav class="main-nav">
    <button id="nav-home" class="nav-btn active" type="button" onclick="showPage('home')">
      <span>🏠</span>Accueil
    </button>
    <button id="nav-appel" class="nav-btn" type="button" onclick="showPage('appel')">
      <span>📋</span>Appel
    </button>
    <button id="nav-bilan" class="nav-btn" type="button" onclick="showPage('bilan')">
      <span>📊</span>Bilan
    </button>
    <button class="nav-btn" type="button" onclick="openRosterModal()">
      <span>👥</span>Élèves
    </button>
    <button id="nav-settings" class="nav-btn" type="button" onclick="showPage('settings')">
      <span>⚙️</span>Réglages
    </button>
  </nav>
</div>

<main>

<!-- PAGE ACCUEIL -->
<section id="page-home" class="page active">
  <div class="stats-grid">
    <div class="stat-card"><span id="stat-students">0</span><small>Élèves</small></div>
    <div class="stat-card"><span id="stat-sessions">0</span><small>Séances</small></div>
    <div class="stat-card"><span id="stat-presences">0</span><small>Présences</small></div>
    <div class="stat-card"><span id="stat-rate">0%</span><small>Assiduité</small></div>
  </div>

  <div class="card">
    <h3>🏃 Activités programmées</h3>
    <div id="home-activities" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;"></div>
  </div>

  <div class="card">
    <h3>🏅 Top Élèves Assidus</h3>
    <div id="top-students"></div>
  </div>
</section>

<!-- PAGE APPEL -->
<section id="page-appel" class="page">
  <div class="card">
    <div class="toolbar-grid">
      <div class="field">
        <label for="appel-date">Date</label>
        <input id="appel-date" type="date" onchange="onDateChanged()">
        <span id="day-hint" class="day-hint"></span>
      </div>
      <div class="field">
        <label for="appel-group">Classe / Groupe</label>
        <select id="appel-group" onchange="renderAppel()"></select>
      </div>
      <div class="field">
        <label for="appel-activity">Activité</label>
        <select id="appel-activity" onchange="renderAppel()"></select>
      </div>
    </div>

    <div class="save-row">
      <button class="btn-save" type="button" onclick="saveSession()">💾 SAUVEGARDER L'APPEL</button>
      <button class="btn-pdf" type="button" onclick="exportPresentPDF()">📄 EXPORTER PDF PRÉSENTS</button>
    </div>
  </div>

  <div class="action-row">
    <button class="btn-sub" type="button" onclick="setAllPresent()">✅ Tous présents</button>
    <button class="btn-sub danger" type="button" onclick="clearCurrentSession()">❌ Tout effacer</button>
  </div>

  <div class="status-bar">
    <span>Présents</span>
    <span id="presence-counter">0 / 0</span>
  </div>

  <div id="students-list" class="student-list"></div>
</section>

<!-- PAGE BILAN -->
<section id="page-bilan" class="page">
  <div class="card">
    <div class="toolbar-grid" style="grid-template-columns: 1fr 1fr;">
      <div class="field">
        <label for="bilan-group">Filtrer par classe</label>
        <select id="bilan-group" onchange="renderBilan()"></select>
      </div>
      <div class="field">
        <label for="bilan-search">Rechercher</label>
        <input id="bilan-search" type="search" placeholder="Nom ou prénom..." oninput="renderBilan()">
      </div>
    </div>
  </div>
  <div id="bilan-list"></div>
</section>

<!-- PAGE REGLAGES -->
<section id="page-settings" class="page">
  <div class="card">
    <h3>🏫 Identification & Sécurité</h3>
    <div class="field" style="margin-bottom:10px;">
      <label>Nom de l'AS</label>
      <input id="set-name" type="text" placeholder="Ex: AS Claudie Haigneré">
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>Ville</label>
      <input id="set-city" type="text" placeholder="Ex: Rouillac">
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>Code secret d'accès</label>
      <input id="set-code" type="password" placeholder="Code secret de l'AS">
    </div>
  </div>

  <div class="card">
    <h3>📅 Planning des Créneaux Hebdomadaires</h3>
    <div id="schedule-settings" style="display:flex;flex-direction:column;gap:8px;"></div>
    <button class="btn-save" style="width:100%;margin-top:12px;" type="button" onclick="saveSettings()">💾 ENREGISTRER LES RÉGLAGES</button>
  </div>
</section>

</main>

<!-- MODAL ELEVES -->
<div id="roster-modal" class="modal-overlay" onclick="outsideModal(event, 'roster-modal')">
  <div class="modal">
    <div class="modal-header">
      <h3>👥 Gestion des élèves</h3>
      <button class="btn-close" type="button" onclick="closeModal('roster-modal')">×</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 80px auto;gap:6px;margin-bottom:12px;">
      <input id="new-nom" type="text" placeholder="Nom">
      <input id="new-prenom" type="text" placeholder="Prénom">
      <input id="new-classe" type="text" placeholder="Classe">
      <button style="background:#16a34a;color:#fff;padding:0 12px;border-radius:10px;font-weight:bold;" type="button" onclick="addStudent()">+</button>
    </div>

    <div id="roster-list" style="display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto;"></div>

    <div style="margin-top:15px;padding:12px;border:2px dashed #cbd5e1;border-radius:12px;text-align:center;">
      <label style="cursor:pointer;font-weight:bold;color:var(--primary);">
        📥 Importer un fichier CSV (Licences ignorées)
        <input type="file" accept=".csv,text/csv" style="display:none;" onchange="importCSV(event)">
      </label>
    </div>
  </div>
</div>

<!-- MODAL ETABLISSEMENTS -->
<div id="schools-modal" class="modal-overlay" onclick="outsideModal(event, 'schools-modal')">
  <div class="modal">
    <div class="modal-header">
      <h3>🏫 Changer d'établissement</h3>
      <button class="btn-close" type="button" onclick="closeModal('schools-modal')">×</button>
    </div>

    <div id="schools-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:15px;"></div>

    <div style="border-top:1px solid var(--border);padding-top:12px;">
      <h4 style="margin-bottom:8px;">➕ Nouveau profil</h4>
      <input id="new-sc-name" type="text" placeholder="Nom de l'AS" style="margin-bottom:6px;">
      <input id="new-sc-city" type="text" placeholder="Ville" style="margin-bottom:6px;">
      <input id="new-sc-code" type="password" placeholder="Code secret d'accès" style="margin-bottom:10px;">
      <button class="btn-save" style="width:100%;min-height:44px;" type="button" onclick="createSchool()">Créer et ouvrir</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* GESTION DES DONNEES */
const DAYS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const DAY_NAMES = { lundi:"Lundi", mardi:"Mardi", mercredi:"Mercredi", jeudi:"Jeudi", vendredi:"Vendredi", samedi:"Samedi" };

const DEFAULT_SCHEDULE = {
  lundi: { enabled: true, name: "Futsal", icon: "⚽" },
  mardi: { enabled: true, name: "Sports Collectifs", icon: "🏀" },
  mercredi: { enabled: true, name: "Compétition", icon: "🏆" },
  jeudi: { enabled: true, name: "Activités Artistiques", icon: "🤸" },
  vendredi: { enabled: true, name: "Badminton", icon: "🏸" },
  samedi: { enabled: false, name: "Plein Air", icon: "🌲" }
};

let dbSchools = {};
let currentId = "rouillac";
let currentSchool = null;

function loadStorage() {
  try {
    const raw = localStorage.getItem("as_schools_v3");
    if (raw) dbSchools = JSON.parse(raw);
  } catch (e) { dbSchools = {}; }

  if (!dbSchools["rouillac"]) {
    let legacyRoster = [];
    try { legacyRoster = JSON.parse(localStorage.getItem("as_roster_v3") || "[]"); } catch(e){}
    dbSchools["rouillac"] = {
      id: "rouillac",
      name: "AS CLAUDIE HAIGNERÉ",
      city: "Rouillac",
      accessCode: "1234",
      schedule: DEFAULT_SCHEDULE,
      roster: legacyRoster,
      sessions: []
    };
    saveStorage();
  }

  currentId = localStorage.getItem("as_current_id") || "rouillac";
  if (!dbSchools[currentId]) currentId = Object.keys(dbSchools)[0];
  currentSchool = dbSchools[currentId];
}

function saveStorage() {
  try {
    localStorage.setItem("as_schools_v3", JSON.stringify(dbSchools));
    localStorage.setItem("as_current_id", currentId);
  } catch (e) {}
}

/* NAVIGATION */
function showPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));

  const target = document.getElementById("page-" + page);
  const btn = document.getElementById("nav-" + page);
  if (target) target.classList.add("active");
  if (btn) btn.classList.add("active");

  if (page === "home") renderHome();
  if (page === "appel") {
    if (!document.getElementById("appel-date").value) {
      const now = new Date();
      document.getElementById("appel-date").value = now.toISOString().split("T")[0];
    }
    onDateChanged();
  }
  if (page === "bilan") renderBilan();
  if (page === "settings") renderSettings();
}

/* GESTION NOM ET LICENCE */
function cleanName(st) {
  let nom = String(st.lastname || "").trim();
  let prenom = String(st.firstname || "").trim();
  if (/^[0-9]+$/.test(nom)) nom = "";
  return (nom.toUpperCase() + " " + prenom).trim();
}

/* SYNCHRONISATION DATE ↔ CRENEAUX */
function onDateChanged() {
  const dVal = document.getElementById("appel-date").value;
  const hint = document.getElementById("day-hint");
  const actSelect = document.getElementById("appel-activity");

  actSelect.innerHTML = "";
  const sched = currentSchool.schedule || DEFAULT_SCHEDULE;

  DAYS.forEach(k => {
    const item = sched[k];
    if (item && item.enabled && item.name) {
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = `${item.icon || "🏃"} ${item.name} (${DAY_NAMES[k]})`;
      actSelect.appendChild(opt);
    }
  });

  if (!dVal) return;
  const dayIdx = new Date(dVal + "T12:00:00").getDay();
  const map = { 1:"lundi", 2:"mardi", 3:"mercredi", 4:"jeudi", 5:"vendredi", 6:"samedi" };
  const dKey = map[dayIdx];

  if (dKey && sched[dKey] && sched[dKey].enabled) {
    actSelect.value = dKey;
    hint.textContent = `📅 Créneau du ${DAY_NAMES[dKey]} : ${sched[dKey].name}`;
  } else {
    hint.textContent = `⚠️ Aucun créneau défini pour ce jour`;
  }
  renderAppel();
}

/* GESTION APPEL */
function renderAppel() {
  const grpSelect = document.getElementById("appel-group");
  const listEl = document.getElementById("students-list");
  const prevGrp = grpSelect.value;

  const classes = Array.from(new Set(currentSchool.roster.map(s => s.class).filter(Boolean))).sort();
  grpSelect.innerHTML = `<option value="">Toutes les classes</option>`;
  classes.forEach(c => {
    grpSelect.innerHTML += `<option value="${c}" ${prevGrp === c ? "selected" : ""}>${c}</option>`;
  });

  const curGrp = grpSelect.value;
  const curDate = document.getElementById("appel-date").value;
  const curAct = document.getElementById("appel-activity").value;

  let session = (currentSchool.sessions || []).find(s => s.date === curDate && s.activity === curAct && s.group === curGrp);
  const presents = session ? session.presenceIds || [] : [];

  let students = [...currentSchool.roster].sort((a,b) => cleanName(a).localeCompare(cleanName(b)));
  if (curGrp) students = students.filter(s => s.class === curGrp);

  document.getElementById("presence-counter").textContent = `${presents.length} / ${students.length}`;

  if (!students.length) {
    listEl.innerHTML = `<p style="text-align:center;padding:20px;color:#94a3b8;">Aucun élève enregistré.</p>`;
    return;
  }

  listEl.innerHTML = students.map(st => {
    const isP = presents.includes(st.id);
    return `
      <div class="student-row">
        <div class="st-info">
          <strong>${cleanName(st)}</strong>
          <small>${st.class || ""}</small>
        </div>
        <button class="btn-p ${isP ? 'present' : ''}" type="button" onclick="togglePresence('${st.id}')">
          ${isP ? '✓' : 'P'}
        </button>
      </div>
    `;
  }).join("");
}

function togglePresence(id) {
  const curDate = document.getElementById("appel-date").value;
  const curAct = document.getElementById("appel-activity").value;
  const curGrp = document.getElementById("appel-group").value;

  if (!currentSchool.sessions) currentSchool.sessions = [];
  let s = currentSchool.sessions.find(x => x.date === curDate && x.activity === curAct && x.group === curGrp);
  if (!s) {
    s = { date: curDate, activity: curAct, group: curGrp, presenceIds: [] };
    currentSchool.sessions.push(s);
  }

  const idx = s.presenceIds.indexOf(id);
  if (idx >= 0) s.presenceIds.splice(idx, 1);
  else s.presenceIds.push(id);

  saveStorage();
  renderAppel();
}

function setAllPresent() {
  const curDate = document.getElementById("appel-date").value;
  const curAct = document.getElementById("appel-activity").value;
  const curGrp = document.getElementById("appel-group").value;

  let s = currentSchool.sessions.find(x => x.date === curDate && x.activity === curAct && x.group === curGrp);
  if (!s) {
    s = { date: curDate, activity: curAct, group: curGrp, presenceIds: [] };
    currentSchool.sessions.push(s);
  }

  let students = currentSchool.roster;
  if (curGrp) students = students.filter(x => x.class === curGrp);
  s.presenceIds = students.map(x => x.id);

  saveStorage();
  renderAppel();
}

function clearCurrentSession() {
  const curDate = document.getElementById("appel-date").value;
  const curAct = document.getElementById("appel-activity").value;
  const curGrp = document.getElementById("appel-group").value;

  let s = currentSchool.sessions.find(x => x.date === curDate && x.activity === curAct && x.group === curGrp);
  if (s) s.presenceIds = [];

  saveStorage();
  renderAppel();
}

function saveSession() {
  saveStorage();
  showToast("Appel sauvegardé 💾");
  renderHome();
}

/* EXPORT PDF */
function exportPresentPDF() {
  const curDate = document.getElementById("appel-date").value;
  const curAct = document.getElementById("appel-activity").value;
  const curGrp = document.getElementById("appel-group").value;

  const s = (currentSchool.sessions || []).find(x => x.date === curDate && x.activity === curAct && x.group === curGrp);
  const pIds = s ? s.presenceIds || [] : [];
  if (!pIds.length) { showToast("Aucun présent à exporter"); return; }

  const presentSt = currentSchool.roster.filter(x => pIds.includes(x.id)).sort((a,b) => cleanName(a).localeCompare(cleanName(b)));

  if (!window.jspdf) { alert("Module PDF non disponible"); return; }
  const doc = new window.jspdf.jsPDF();

  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.setTextColor(29, 78, 216);
  doc.text((currentSchool.name || "AS").toUpperCase(), 15, 20);

  doc.setFontSize(12);
  doc.setTextColor(30, 41, 59);
  doc.text(`Liste d'appel des présents - ${curDate}`, 15, 28);
  doc.text(`Nombre de présents : ${presentSt.length}`, 15, 35);

  let y = 45;
  doc.setFontSize(10);
  presentSt.forEach((st, i) => {
    if (y > 275) { doc.addPage(); y = 20; }
    let nom = String(st.lastname || "").trim();
    if (/^[0-9]+$/.test(nom)) nom = "";
    doc.text(`${i+1}. ${nom.toUpperCase()} ${st.firstname || ""}`, 15, y);
    y += 7;
  });

  doc.save(`presents_${curDate}.pdf`);
  showToast("PDF téléchargé 📄");
}

/* BILAN */
function renderBilan() {
  const grp = document.getElementById("bilan-group").value;
  const search = (document.getElementById("bilan-search").value || "").toLowerCase();
  const list = document.getElementById("bilan-list");

  let students = [...currentSchool.roster].sort((a,b) => cleanName(a).localeCompare(cleanName(b)));
  if (grp) students = students.filter(s => s.class === grp);
  if (search) students = students.filter(s => cleanName(s).toLowerCase().includes(search));

  list.innerHTML = students.map(st => {
    let count = 0;
    (currentSchool.sessions || []).forEach(sess => {
      if ((sess.presenceIds || []).includes(st.id)) count++;
    });
    return `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px;margin-bottom:8px;">
        <div><strong>${cleanName(st)}</strong><small style="color:#64748b;">${st.class || ""}</small></div>
        <div style="background:#dcfce7;color:#15803d;padding:6px 12px;border-radius:10px;font-weight:bold;">${count} présence(s)</div>
      </div>
    `;
  }).join("");
}

/* ACCUEIL */
function renderHome() {
  document.getElementById("app-school-name").textContent = currentSchool.name || "AS";
  document.getElementById("app-school-sub").textContent = currentSchool.city || "";

  document.getElementById("stat-students").textContent = currentSchool.roster.length;
  document.getElementById("stat-sessions").textContent = (currentSchool.sessions || []).length;

  let totalP = 0;
  (currentSchool.sessions || []).forEach(s => totalP += (s.presenceIds || []).length);
  document.getElementById("stat-presences").textContent = totalP;

  const actCont = document.getElementById("home-activities");
  const sched = currentSchool.schedule || DEFAULT_SCHEDULE;
  actCont.innerHTML = DAYS.filter(k => sched[k]?.enabled).map(k => `
    <div style="background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;">
      <span style="font-size:20px;">${sched[k].icon}</span>
      <strong style="display:block;font-size:12px;">${sched[k].name}</strong>
      <small style="color:var(--muted);">${DAY_NAMES[k]}</small>
    </div>
  `).join("");
}

/* REGLAGES */
function renderSettings() {
  document.getElementById("set-name").value = currentSchool.name || "";
  document.getElementById("set-city").value = currentSchool.city || "";
  document.getElementById("set-code").value = currentSchool.accessCode || "";

  const cont = document.getElementById("schedule-settings");
  const sched = currentSchool.schedule || DEFAULT_SCHEDULE;

  cont.innerHTML = DAYS.map(k => {
    const item = sched[k] || { enabled: false, name: "", icon: "⚽" };
    return `
      <div style="display:grid;grid-template-columns:30px 80px 1fr;gap:6px;align-items:center;background:#f8fafc;padding:6px 10px;border-radius:10px;">
        <input type="checkbox" id="sc-${k}" ${item.enabled ? 'checked' : ''}>
        <strong>${DAY_NAMES[k]}</strong>
        <input type="text" id="sn-${k}" value="${item.name || ''}" placeholder="Activité">
      </div>
    `;
  }).join("");
}

function saveSettings() {
  currentSchool.name = document.getElementById("set-name").value.trim() || "AS";
  currentSchool.city = document.getElementById("set-city").value.trim();
  currentSchool.accessCode = document.getElementById("set-code").value.trim();

  const sched = {};
  DAYS.forEach(k => {
    sched[k] = {
      enabled: document.getElementById(`sc-${k}`).checked,
      name: document.getElementById(`sn-${k}`).value.trim(),
      icon: "🏃"
    };
  });
  currentSchool.schedule = sched;

  saveStorage();
  renderHome();
  showToast("Réglages sauvegardés 💾");
}

/* ELEVES & IMPORT */
function openRosterModal() {
  renderRoster();
  document.getElementById("roster-modal").classList.add("show");
}
function closeModal(id) { document.getElementById(id).classList.remove("show"); }
function outsideModal(e, id) { if (e.target.id === id) closeModal(id); }

function renderRoster() {
  const el = document.getElementById("roster-list");
  el.innerHTML = currentSchool.roster.map(st => `
    <div style="display:flex;justify-content:space-between;padding:6px;background:#f8fafc;border-radius:8px;">
      <span><strong>${cleanName(st)}</strong> (${st.class || '-'})</span>
      <button style="color:#ef4444;font-weight:bold;" type="button" onclick="deleteStudent('${st.id}')">✕</button>
    </div>
  `).join("");
}

function addStudent() {
  const nom = document.getElementById("new-nom").value.trim();
  const prenom = document.getElementById("new-prenom").value.trim();
  const classe = document.getElementById("new-classe").value.trim();
  if (!nom || !prenom) return;

  currentSchool.roster.push({ id: Date.now().toString(36), lastname: nom, firstname: prenom, class: classe });
  document.getElementById("new-nom").value = "";
  document.getElementById("new-prenom").value = "";
  document.getElementById("new-classe").value = "";

  saveStorage();
  renderRoster();
}

function deleteStudent(id) {
  currentSchool.roster = currentSchool.roster.filter(s => s.id !== id);
  saveStorage();
  renderRoster();
}

function importCSV(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const lines = evt.target.result.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    let count = 0;
    lines.forEach((l, idx) => {
      let parts = l.split(";").map(p => p.replace(/^"|"$/g, "").trim());
      if (/^[0-9]{4,}$/.test(parts[0])) parts.shift();
      if (idx === 0 && (parts[0].toLowerCase().includes("nom") || parts[0].toLowerCase().includes("licence"))) return;
      if (parts[0] && parts[1]) {
        currentSchool.roster.push({ id: Date.now().toString(36) + Math.random().toString(36).substr(2,4), lastname: parts[0], firstname: parts[1], class: parts[2] || "" });
        count++;
      }
    });
    saveStorage();
    renderRoster();
    showToast(`${count} élèves importés ✅`);
  };
  reader.readAsText(f, "UTF-8");
}

/* ETABLISSEMENTS */
function openSchoolsModal() {
  const cont = document.getElementById("schools-list");
  cont.innerHTML = Object.values(dbSchools).map(s => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:#f8fafc;border-radius:10px;border:1px solid var(--border);">
      <div><strong>${s.name}</strong><br><small>${s.city || ""}</small></div>
      <button style="background:var(--primary);color:#fff;padding:6px 12px;border-radius:8px;font-weight:bold;" type="button" onclick="switchSchool('${s.id}')">Ouvrir</button>
    </div>
  `).join("");
  document.getElementById("schools-modal").classList.add("show");
}

function switchSchool(id) {
  const s = dbSchools[id];
  if (s.accessCode) {
    const code = prompt(`Code secret requis pour ${s.name} :`);
    if (code !== s.accessCode) { alert("Code incorrect"); return; }
  }
  currentId = id;
  currentSchool = dbSchools[id];
  saveStorage();
  closeModal("schools-modal");
  renderHome();
  showToast(`Établissement : ${currentSchool.name}`);
}

function createSchool() {
  const name = document.getElementById("new-sc-name").value.trim();
  const city = document.getElementById("new-sc-city").value.trim();
  const code = document.getElementById("new-sc-code").value.trim();
  if (!name) return;

  const id = "sc_" + Date.now().toString(36);
  dbSchools[id] = { id, name, city, accessCode: code, schedule: DEFAULT_SCHEDULE, roster: [], sessions: [] };
  currentId = id;
  currentSchool = dbSchools[id];
  saveStorage();
  closeModal("schools-modal");
  renderHome();
  showToast("Profil créé !");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

document.addEventListener("DOMContentLoaded", () => {
  loadStorage();
  renderHome();
});
</script>
